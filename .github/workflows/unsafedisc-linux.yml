name: Native unSafeDisc unwrap / inspect (Linux and Windows)

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'src/bin/unsafedisc-linux.rs'
      - 'src/unsafedisc_*.rs'
      - 'docs/unsafedisc-linux.md'
      - 'docs/dll-state-references.md'
      - '.github/workflows/unsafedisc-linux.yml'
      - 'python/**'
      - 'scripts/**'
      - 'archive/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86_64 - native unwrap and inspect
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests (synthetic fixtures only)
        run: cargo test --bin unsafedisc-linux
      - name: Python SafeDisc research syntax and synthetic tests
        run: |
          python -m compileall -q python scripts
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build native Linux executable
        run: cargo build --release --bin unsafedisc-linux
      - name: Smoke test CLI
        run: |
          ./target/release/unsafedisc-linux --help
          ./target/release/unsafedisc-linux unwrap --help
          if ./target/release/unsafedisc-linux unpack; then
            echo "ERROR: unsupported unpack command unexpectedly succeeded"
            exit 1
          fi
          # Historical-only entry must not need any Crimson game file,
          # and must reject a missing/incorrect original executable.
          if ./target/release/unsafedisc-linux inspect-historical --unsafedisc ./nonexistent-original-unSafedisc.exe; then
            echo "ERROR: missing historical executable unexpectedly accepted"
            exit 1
          fi
      - name: Upload experimental Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: unsafedisc-linux-x86_64
          path: target/release/unsafedisc-linux
          if-no-files-found: error

  windows-x86_64:
    name: Windows x86_64 - native unwrap and inspect
    runs-on: windows-2022
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests (synthetic fixtures only)
        run: cargo test --bin unsafedisc-linux
      - name: Python SafeDisc research syntax and synthetic tests
        run: |
          python -m compileall -q python scripts
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build native Windows executable
        run: cargo build --release --bin unsafedisc-linux
      - name: Smoke test CLI
        shell: pwsh
        run: |
          & .\target\release\unsafedisc-linux.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "Windows CLI --help failed"
          }
          & .\target\release\unsafedisc-linux.exe unwrap --help
          if ($LASTEXITCODE -ne 0) {
            throw "Windows unwrap --help failed"
          }
          # GitHub Actions' PowerShell wrapper normally treats a native
          # command's nonzero exit status as a job failure. Here that
          # failure is exactly what we are testing.
          $PSNativeCommandUseErrorActionPreference = $false
          & .\target\release\unsafedisc-linux.exe unpack
          if ($LASTEXITCODE -eq 0) {
            throw "ERROR: unsupported unpack command unexpectedly succeeded"
          }
          Write-Host "Unsupported unpack command was correctly rejected."
          & .\target\release\unsafedisc-linux.exe inspect-historical --unsafedisc .\nonexistent-original-unSafedisc.exe
          if ($LASTEXITCODE -eq 0) {
            throw "ERROR: missing historical executable unexpectedly accepted"
          }
          Write-Host "Missing historical original was correctly rejected."
          exit 0
      - name: Upload experimental Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: unsafedisc-windows-x86_64
          path: target/release/unsafedisc-linux.exe
          if-no-files-found: error
